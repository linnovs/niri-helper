[package]
name = "niri-helper"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "niri-helper"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
niri-ipc = "26.4.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-util", "time"] }
toml = "1"
